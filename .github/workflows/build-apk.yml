name: Gerar APK do AQUI TEM

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses:       - name: Aceitar licenças do Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Extrair projeto
        run: |
          mkdir -p /tmp/proj
          unzip -q "$(ls *.zip | head -n 1)" -d /tmp/proj
          DIR=$(dirname "$(find /tmp/proj -name 'settings.gradle*' | head -n 1)")
          echo "PROJ=$DIR" >> $GITHUB_ENV
      - name: Compilar APK
        working-directory: ${{ env.PROJ }}
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace; else gradle assembleDebug --stacktrace; fi
      - uses: actions/upload-artifact@v4
        with:
          name: AQUI-TEM-apk-debug
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
